[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-search"
version = "2.2.0"
description = "Face retrieval with shared local and server search"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=2.0,<3", "Pillow>=11.1,<12", "requests>=2.32.4,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.47.1,<2"]
server = [
    "fastapi>=0.162,<1", "starlette>=1.3.1,<2", "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<0.1",
]
encoder = [
    "face_recognition @ git+https://github.com/thetoby9944/face_recognition.git@d632e2e8d5b5b286d944c333f3ff4433dafabb19",
]
encoder-wheel = ["dlib-bin==19.24.6"]
crawler = ["beautifulsoup4>=4.13,<5", "ImageHash>=4.3,<5", "filelock>=3.19,<4", "warcio>=1.7,<2"]
training = ["torch==2.5.1", "torchvision==0.20.1", "datasets>=4,<5"]
test = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.28.1,<0.29"]

[tool.setuptools.packages.find]
include = ["face_search*", "model2*", "tools*", "crawler*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
